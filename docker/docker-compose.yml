services:
  train:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    runtime: nvidia
    environment:
      - WANDB_API_KEY=${WANDB_API_KEY:-}
      - WANDB_MODE=${WANDB_MODE:-online}
    volumes:
      - ..:/workspace
    command:
      - --total-steps=3000000
      - --players=mix
      - --wandb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  train-selfplay:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    runtime: nvidia
    environment:
      - WANDB_API_KEY=${WANDB_API_KEY:-}
      - WANDB_MODE=${WANDB_MODE:-online}
    volumes:
      - ..:/workspace
    command:
      - --total-steps=5000000
      - --players=mix
      - --selfplay
      - --snapshot-every=500
      - --eval-past=20
      - --wandb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  train-strong-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    runtime: nvidia
    environment:
      - WANDB_API_KEY=${WANDB_API_KEY:-}
      - WANDB_MODE=${WANDB_MODE:-online}
    volumes:
      - ..:/workspace
    command:
      - --total-steps=3000000
      - --players=mix
      - --strong-agent
      - --wandb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  eval:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    runtime: nvidia
    volumes:
      - ..:/workspace
    command:
      - --eval=50
      - --opponent=sniper.py
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  eval-strong-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    runtime: nvidia
    volumes:
      - ..:/workspace
    command:
      - --eval=50
      - --strong-agent
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  shell:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    runtime: nvidia
    volumes:
      - ..:/workspace
    entrypoint: /bin/bash
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
